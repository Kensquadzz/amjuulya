<!doctype html><meta charset="utf-8"><base href="/"><body><script type="module">
import { SFX, renderSfx } from '/src/engine/sfx.ts';
import { mixdown, sfxClip, extractAudioFromVideo, encodeMp3 } from '/src/engine/audio.ts';
import { exportVideo, detectCapabilities } from '/src/engine/exporter.ts';
import { TEMPLATES, projectFromTemplate } from '/src/engine/templates.ts';
const b64 = async (blob) => { const buf = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000)); return btoa(s); };
const stats = (b) => { let peak = 0, sum = 0, nan = 0; for (let c = 0; c < b.numberOfChannels; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) { const v = d[i]; if (!Number.isFinite(v)) nan++; else { peak = Math.max(peak, Math.abs(v)); sum += v * v; } } } return { dur: +b.duration.toFixed(2), peak: +peak.toFixed(3), rmsDb: +(10 * Math.log10(sum / (b.length * b.numberOfChannels) + 1e-12)).toFixed(1), nan }; };
window.run = async () => {
  const out = { sfx: {} };
  for (const s of SFX) out.sfx[s.id] = stats(await renderSfx(s.id));
  const p = projectFromTemplate(TEMPLATES.find((t) => t.id === 'reel-bold'), '9:16');
  p.audio = [await sfxClip('padDark', 0, { volume: 0.6, duration: 6, fadeOut: 1 }), await sfxClip('whoosh', 0.2), await sfxClip('typing', 0.3, { duration: 1.2 }), await sfxClip('impact', 0.9)];
  out.mix = stats(await mixdown(p, 6));
  // extract audio from the reference .mov
  const f = new File([await (await fetch(window.REF || '/tests/ref-video.mov')).blob()], 'ref-video.mov', { type: 'video/quicktime' });
  try { const a = await extractAudioFromVideo(f); out.extract = { name: a.name, dur: +a.duration.toFixed(2), mp3: a.mp3.size }; out.mp3b64 = await b64(a.mp3); } catch (e) { out.extract = 'ERR ' + e.message; }
  // export with audio
  const caps = await detectCapabilities(540, 960);
  const short = { ...p, duration: 2.5 };
  const e1 = await exportVideo(short, { method: 'webcodecs', codec: caps.webcodecs[0].codec, scale: 0.5, fps: 30, duration: 2.5, quality: 'medium' }, () => {}, new AbortController().signal);
  out.wc = { file: e1.filename, size: e1.blob.size, audio: e1.audio, codec: e1.audioCodec }; out.wcb64 = await b64(e1.blob);
  const e2 = await exportVideo(short, { method: 'mediarecorder', mimeType: caps.mediarecorder.find((m) => m.mimeType.includes('webm')).mimeType, scale: 0.5, fps: 30, duration: 2.5, quality: 'medium' }, () => {}, new AbortController().signal);
  out.mr = { file: e2.filename, size: e2.blob.size, audio: e2.audio, mime: e2.mimeType }; out.mrb64 = await b64(e2.blob);
  return out;
};
</script>
